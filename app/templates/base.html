<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Fiche Locale{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ version_css }}">
  {% block tete_supplementaire %}{% endblock %}
</head>
<body>
  {% block corps %}
  <div class="disposition">
    <aside class="barre-laterale">
      <div class="entete-barre-laterale">
        <div class="marque">
          <span class="marque-icone">FL</span>
          <span class="marque-texte">Fiche Locale</span>
        </div>
        <button type="button" id="bouton-menu-mobile" class="bouton-menu-mobile" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu-laterale">☰</button>
      </div>
      <div class="menu-laterale-repliable" id="menu-laterale">
        <nav class="nav-laterale">
          <a href="/" class="{{ 'lien-actif' if page_actuelle == 'clients' else '' }}">
            <span class="nav-icone">◧</span> Clients
          </a>
          <a href="/posts" class="{{ 'lien-actif' if page_actuelle == 'posts' else '' }}">
            <span class="nav-icone">▤</span> Posts en masse
          </a>
          <a href="/avis" class="{{ 'lien-actif' if page_actuelle == 'avis' else '' }}">
            <span class="nav-icone">★</span> Avis
          </a>
          <a href="/historique" class="{{ 'lien-actif' if page_actuelle == 'historique' else '' }}">
            <span class="nav-icone">⟲</span> Historique
          </a>
          <a href="/google/comptes" class="{{ 'lien-actif' if page_actuelle == 'comptes_google' else '' }}">
            <span class="nav-icone">⚙</span> Comptes Google
          </a>
        </nav>
        <a class="lien-deconnexion-barre" href="/deconnexion">Se déconnecter</a>
      </div>
    </aside>
    <main class="zone-contenu">
      {% block contenu %}{% endblock %}
    </main>
  </div>
  <script>
    (function () {
      const bouton = document.getElementById("bouton-menu-mobile");
      const menu = document.getElementById("menu-laterale");
      if (!bouton) return;
      bouton.addEventListener("click", () => {
        const ouvert = menu.classList.toggle("ouvert");
        bouton.setAttribute("aria-expanded", ouvert ? "true" : "false");
      });
    })();
  </script>
  <script>
    // Feedback visuel generique sur les boutons de validation (Enregistrer,
    // Ajouter, Supprimer...) : desactive le bouton et affiche "En cours..."
    // pendant le chargement de la page suivante. Ne s'applique qu'aux
    // formulaires soumis normalement (navigation) - si un script dedie a deja
    // intercepte la soumission (fetch, etc., via preventDefault), on ne
    // touche a rien pour ne pas interferer avec sa propre gestion.
    document.addEventListener("submit", (evenement) => {
      if (evenement.defaultPrevented) return;
      const bouton = evenement.submitter
        || evenement.target.querySelector('button[type="submit"], input[type="submit"]');
      if (!bouton || bouton.disabled) return;
      bouton.disabled = true;
      if (bouton.tagName === "BUTTON") {
        bouton.textContent = "⏳ En cours...";
      } else {
        bouton.value = "⏳ En cours...";
      }
    });
  </script>
  {% endblock %}
</body>
</html>
